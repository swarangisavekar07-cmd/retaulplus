version: '3.8'

# =====================================================================
# RetailPulse AI — Multi-Container Docker Orchestration
# =====================================================================
# Services:
#   - postgres           : Source transactional database (CSV ingest target)
#   - airflow-webserver  : Apache Airflow UI and Webserver (port 8080)
#   - airflow-scheduler  : Apache Airflow DAG scheduler
#   - streamlit-app      : RetailPulse AI Conversational BI Dashboard (port 8501)
# =====================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow_db
    - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqnvq8=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
    - AIRFLOW__WEBSERVER__SECRET_KEY=retailpulse_secret_key_12345
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_DB=retail_pulse_db
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - GCP_PROJECT_ID=${GCP_PROJECT_ID:-retailpulse-demo-project}
    - BIGQUERY_RAW_DATASET=${BIGQUERY_RAW_DATASET:-raw_retailpulse}
    - BIGQUERY_ANALYTICS_DATASET=${BIGQUERY_ANALYTICS_DATASET:-analytics_retailpulse}
    - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/config/gcp-key.json
    - PYTHONPATH=/opt/airflow:/opt/airflow/scripts
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./dbt:/opt/airflow/dbt
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # -------------------------------------------------------------------
  # 1. Source Database: PostgreSQL for Retail Transactions
  # -------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: retailpulse_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_pulse_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_source_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail_pulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retailpulse_net

  # -------------------------------------------------------------------
  # 2. Metastore Database for Airflow
  # -------------------------------------------------------------------
  postgres_airflow:
    image: postgres:15-alpine
    container_name: retailpulse_airflow_metastore
    environment:
      POSTGRES_DB: airflow_db
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - pg_airflow_data:/var/lib/postgresql/data
    networks:
      - retailpulse_net

  # -------------------------------------------------------------------
  # 3. Airflow Initialization Service
  # -------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: retailpulse_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --firstname RetailPulse \
          --lastname Admin \
          --role Admin \
          --email admin@retailpulse.ai \
          --password admin || true
    depends_on:
      - postgres_airflow
    networks:
      - retailpulse_net

  # -------------------------------------------------------------------
  # 4. Airflow Webserver (UI on Port 8080)
  # -------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: retailpulse_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - retailpulse_net

  # -------------------------------------------------------------------
  # 5. Airflow Scheduler
  # -------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: retailpulse_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - retailpulse_net

  # -------------------------------------------------------------------
  # 6. Conversational BI Dashboard: Streamlit (Port 8501)
  # -------------------------------------------------------------------
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailpulse_streamlit
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-retail_pulse_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-retailpulse-demo-project}
      - BIGQUERY_ANALYTICS_DATASET=${BIGQUERY_ANALYTICS_DATASET:-analytics_retailpulse}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/gcp-key.json
    volumes:
      - .:/app
    depends_on:
      - postgres
    networks:
      - retailpulse_net

volumes:
  pg_source_data:
  pg_airflow_data:

networks:
  retailpulse_net:
    driver: bridge
